<!doctype html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>استادیار</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
:root{--bg:#f4efe6;--bg2:#ece4d3;--card:#fffdf9;--ink:#1f2a2a;--muted:#647070;--accent:#2f6f66;--accent2:#24534c;--on:#ffffff;--gold:#c08a2e;--line:#e2d9c8;--hl:rgba(192,138,46,.18);--green:#2e9d5b;--bad:#b3261e;--shadow:0 6px 18px rgba(31,42,42,.08)}
[data-theme=dark]{--bg:#1c2a2b;--bg2:#22363a;--card:#263d40;--ink:#eef4f1;--muted:#b5c7c2;--accent:#7fd3c0;--accent2:#a7e8da;--on:#10201f;--gold:#e8b964;--line:#3a5656;--hl:rgba(232,185,100,.16);--green:#5fd39a;--bad:#ff8a80;--shadow:0 6px 18px rgba(0,0,0,.25)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(1200px 600px at 80% -10%,var(--bg2),var(--bg)) fixed;color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;font-size:16px;line-height:1.7}
body{min-height:100vh;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-width:0;width:100%}
textarea{resize:vertical}
.btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on);border:0;border-radius:14px;padding:10px 18px;cursor:pointer;font-weight:600;transition:transform .15s,box-shadow .15s;white-space:nowrap;text-decoration:none;display:inline-block}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.sm{padding:6px 12px;font-size:15px}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:2px 4px;font-size:15px}
.link.danger{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px;transition:transform .2s,box-shadow .2s}
.card:hover{box-shadow:0 10px 26px rgba(31,42,42,.12)}
.card h3{margin:0 0 12px;font-size:19px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 160px}
.row>.btn,.row>.link,.row>label.btn{flex:0 0 auto}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.warn{color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form label{display:grid;gap:6px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{text-align:center;margin:0}
.stat b{display:block;font-size:30px;color:var(--accent)}
.stat span{color:var(--muted)}
.tablewrap{overflow:auto;border-radius:16px;border:1px solid var(--line)}
.tablewrap.sticky th:first-child,.tablewrap.sticky td:first-child{position:sticky;right:0;background:var(--card);z-index:1}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle;white-space:nowrap}
th{background:var(--bg2);font-weight:600}
td:first-child{text-align:right}
tbody tr:hover td{background:var(--hl)}
.mini{font-size:14px}
.desc{font-size:14px;color:var(--muted);white-space:normal;max-width:220px;margin:4px auto 0}
.sc,.num{width:90px;text-align:center}
.st{border:0;border-radius:10px;padding:6px 10px;min-width:70px;cursor:pointer;background:var(--bg2);color:var(--muted);font-weight:600}
.s-p{background:var(--green);color:#fff}
.s-x{background:var(--accent);color:var(--on)}
.s-l{background:var(--gold);color:#1f1a10}
.s-a{background:var(--bad);color:#fff}
.tag{display:inline-block;background:var(--hl);color:var(--gold);border-radius:999px;padding:2px 10px;font-size:14px}
.total{font-weight:700;color:var(--accent)}
.bar{height:14px;background:var(--bg2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.dist{display:grid;gap:8px}
.dist>div{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center}
.tabs{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0;display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tab{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer;white-space:nowrap;transition:transform .15s}
.tab:hover{transform:translateY(-1px)}
.tab.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on);border-color:transparent}
header{display:flex;align-items:center;gap:12px;padding:14px 0 8px}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.hlogo svg{width:52px;height:52px;display:block}
.brand h1{font-size:23px;margin:0;line-height:1.2}
.brand small{color:var(--muted);display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer;white-space:nowrap}
main{flex:1;width:100%;max-width:1200px;margin:0 auto;padding:0 16px}
.hero p{margin:4px 0}
footer{border-top:1px solid var(--line);margin-top:24px;padding:18px 16px;color:var(--muted);text-align:center;font-size:15px}
footer .frow{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap}
footer a{color:var(--accent);text-decoration:none}
.flogo svg{width:34px;height:34px;display:inline-block;vertical-align:middle}
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:16px}
.login .card{width:min(420px,100%);text-align:center;padding:30px 26px}
.login .logo svg{width:160px;height:160px;display:block;margin:0 auto}
.login form{display:grid;gap:12px;margin-top:20px}
.login .btn{width:100%;padding:12px}
.err{color:var(--bad);min-height:24px;margin:4px 0 0}
.login footer{border:0;margin:0;background:none}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 18px;border-radius:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
@media(max-width:820px){.grid2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){body{font-size:16px}.brand h1{font-size:20px}.card{padding:14px}.stat b{font-size:24px}header{flex-wrap:wrap}.hlogo svg{width:42px;height:42px}}
@media print{header,.tabs,footer,.noprint,button{display:none!important}html,body{background:#fff;color:#000}.card{box-shadow:none}}

[hidden]{display:none!important}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.course{cursor:pointer;margin:0}
.course:focus-visible{outline:2px solid var(--accent)}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.filters input{max-width:300px;flex:1 1 220px}
.filters select{max-width:200px;flex:0 1 180px}
.dpick{display:inline-flex;gap:6px}
.dpick select{width:auto;padding:8px 8px}
.star{font-size:18px;color:var(--muted)}
.star.on{color:var(--gold)}
.ok{color:var(--green);font-weight:700}
.cell .sc{margin:0 auto}
#menuBtn{display:none}
.txt{display:inline}
.btn.sm{font-size:15px}
.grid2 label,.form label{display:grid;gap:6px;color:var(--muted)}
@page{size:A4 landscape;margin:12mm}
@media(max-width:640px){
  .tabs{display:none;position:sticky;top:0;grid-template-columns:repeat(2,1fr);gap:6px;background:var(--bg);padding:8px 0}
  .tabs.open{display:grid}
  .tab{text-align:center;padding:9px 8px;font-size:15px}
  #menuBtn{display:inline-block}
  .txt{display:none}
  .brand small{display:none}
  .brand h1{font-size:19px}
  .hlogo svg{width:40px;height:40px}
  .icon-btn{padding:7px 11px}
  .row>*{flex:1 1 100%}
  .row>.btn,.row>.link{flex:0 0 auto}
  .dpick select{flex:1 1 auto}
  .filters input,.filters select{max-width:none;flex:1 1 100%}
  .tablewrap table{min-width:420px}
}
@media print{
  body *{visibility:hidden}
  .printable,.printable *{visibility:visible}
  .printable{position:absolute;left:0;top:0;width:100%;padding:0}
  .printable .card{box-shadow:none;border:0;padding:6px 0}
  .printable .tablewrap{overflow:visible}
  .printable table{min-width:0;font-size:11px}
  .printable th,.printable td{padding:4px 5px;white-space:normal}
  .printable .stat b{font-size:18px}
  .noprint{display:none!important}
}
</style>
</head>

const ITER=250000;
const $=s=>document.querySelector(s);
$('#tname').value=localStorage.getItem('ostadyar-user')||'';
$('#lf').addEventListener('submit',async e=>{
  e.preventDefault();
  const name=$('#tname').value.trim(), pw=$('#tpw').value, btn=$('#lf button');
  $('#err').textContent='';
  if(!pw){$('#err').textContent='رمز ورود رو وارد کن';return;}
  if(name)localStorage.setItem('ostadyar-user',name);
  window.__ostadyarUser=name||localStorage.getItem('ostadyar-user')||'';
  btn.disabled=true;
  let src;
  try{
    const raw=Uint8Array.from(atob(ENC),c=>c.charCodeAt(0));
    const salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    src=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct));
  }catch(err){
    $('#err').textContent='رمز ورود درست نیست';
    btn.disabled=false;
    return;
  }
  $('#login').hidden=true;
  $('#app').hidden=false;
  const s=document.createElement('script');
  s.textContent=src;
  document.body.appendChild(s);
  window.__plannerBoot();
});
</script>
